services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova_otica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina uma POSTGRES_PASSWORD forte}
      POSTGRES_DB: ${POSTGRES_DB:-nova_otica}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # SEM `ports:` de propósito. O banco fala só com a API, pela rede interna do
    # compose. Publicar 5432 no host é o erro mais comum e mais caro deste tipo
    # de instalação: o Postgres passa a ser varrido da internet em minutos.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nova_otica}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        # Carimba a versão na imagem. O `deploy.sh` exporta esta variável a
        # partir do commit que acabou de fazer checkout; quem constrói à mão
        # sem exportá-la recebe imagem sem versão, e o /health diz `null` em
        # vez de mentir um número.
        GIT_SHA: ${GIT_SHA:-}
    image: nova-otica-app:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # O .env INTEIRO vai para o container, em vez de uma lista escrita à mão.
    #
    # A lista à mão falhou em produção (04/08/2026): eu enumerei as variáveis
    # que achei que importavam e 21 das 38 do schema da API ficaram de fora.
    # A que doeu primeiro foi SELLBIE_IGNORE_WINDOW — estava no .env, o código
    # a lia, e ela chegava `undefined` no processo. O sintoma foi "sincronização
    # fora da janela permitida" com a variável configurada corretamente, que é o
    # tipo de contradição que custa uma hora para diagnosticar.
    #
    # Enumeração à mão sempre esquece, e esquece em silêncio: a variável some,
    # o default entra no lugar e nada indica que houve substituição. `env_file`
    # não tem como esquecer.
    env_file:
      - .env
    # `environment` vence o `env_file`, e é aqui que ficam só os valores
    # COMPOSTOS ou que a produção precisa forçar.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nova_otica}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nova_otica}?schema=public
      # Sem defaults inseguros: o compose falha se estes não forem definidos.
      JWT_SECRET: ${JWT_SECRET:?defina um JWT_SECRET forte (>= 24 caracteres)}
      WEB_ORIGIN: ${WEB_ORIGIN:?defina WEB_ORIGIN com origens explicitas, sem curinga}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?defina uma SEED_ADMIN_PASSWORD própria}
      # As credenciais da CDS e todo o resto do SELLBIE_* chegam pelo env_file
      # acima. Elas só existem no .env da VPS, com permissão 600 — nunca no
      # Git, seja ele público ou privado.
      #
      # Atrás do Caddy, sem TRUST_PROXY o Express vê o IP do proxy em toda
      # requisição: o limite de 10 tentativas de login por 15 minutos passaria a
      # ser compartilhado por TODOS os usuários da rede, e um operador
      # distraído trancaria as 19 lojas.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # O fuso do agendador é o de Natal, não o de São Paulo do default.
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-America/Recife}
      # O lote das 6h é 6h EM NATAL. Sem fuso explícito o container roda em UTC
      # e o sync cai às 03h local — antes de a rede abrir e depois do
      # fechamento do dia anterior, que é o pior dos dois mundos.
      TZ: ${TZ:-America/Recife}
      # Saída fixada em IPv4. A droplet tem IPv6 público, e o Node prefere IPv6
      # quando o destino resolve nos dois. Como a allowlist do conector CDS é
      # por IP, uma saída que alterna entre IPv4 e IPv6 produz o pior tipo de
      # falha: "liberamos o IP e continua dando 403", sem nada no log apontando
      # para o motivo. Um endereço para liberar, um caminho para depurar.
      # Sem ${NODE_OPTIONS:-...} de propósito: com a forma de default, um
      # NODE_OPTIONS definido no host vence e a fixação de IPv4 some sem aviso.
      #
      # `--max-old-space-size=768` não é afinação: é o que decide QUEM morre.
      # Sem teto, o V8 dimensiona o heap pela memória da máquina e só coleta
      # com folga quando acha que ainda há. Medido em base do tamanho da
      # produção: o processo vai de 78 MB ocioso a 644 MB depois de UMA
      # requisição a /planning/decisions, e a 856 MB com três concorrentes —
      # e não devolve. Numa droplet de 2 GB que também roda Postgres e Caddy,
      # quem escolhe a vítima passa a ser o OOM killer do kernel, e ele pode
      # muito bem escolher o banco. Com o teto, o excesso vira um
      # "JavaScript heap out of memory" no log deste container, com pilha, e o
      # `restart: unless-stopped` recoloca a API no ar em segundos.
      NODE_OPTIONS: --dns-result-order=ipv4first --max-old-space-size=768
    # O teto do CONTÊINER fica acima do teto do heap de propósito: o processo
    # Node também tem pilha, buffers de rede e o que o Prisma aloca fora do
    # heap do V8. Se os dois fossem iguais, o cgroup mataria o processo antes
    # de o V8 conseguir emitir o erro legível — trocaríamos um diagnóstico por
    # um `Killed`.
    #
    # `memswap_limit` igual a `mem_limit` desliga o swap para este serviço.
    # Sem isso, o contêiner que estoura passa a paginar em disco e o sintoma
    # deixa de ser "a API caiu" e vira "o sistema inteiro está lento" — que é
    # muito mais caro de diagnosticar, e leva o Postgres junto.
    mem_limit: 1g
    memswap_limit: 1g
    # Também sem `ports:`. Quem publica é o Caddy; a API só é alcançável por
    # dentro da rede do compose. É isso que impede alguém de chegar em
    # http://IP:3333 e pular o TLS.
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMINIO: "${DOMINIO:?defina o dominio, ex. app.novaotica.gb.app.br}"
      ACME_EMAIL: ${ACME_EMAIL:?defina o e-mail do certificado}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # `caddy_data` guarda os certificados. É volume nomeado de propósito:
      # perdê-los a cada deploy faria bater no limite de emissão da Let's
      # Encrypt (5 por domínio por semana) e o site ficaria sem HTTPS.
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy

  # Backup diário do banco. Serviço próprio em vez de cron do host: assim ele
  # sobe junto no `docker compose up` e não depende de alguém lembrar de
  # instalar a linha de cron na máquina.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova_otica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nova_otica}
      POSTGRES_HOST: db
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-America/Recife}
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    # Um dump por dia, às 03:00 no fuso do container. Dorme até a próxima 03:00
    # em vez de instalar um cron: um processo a menos, o mesmo resultado.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          agora=$$(date +%s)
          alvo=$$(date -d "today 03:00" +%s 2>/dev/null || echo $$agora)
          [ "$$alvo" -le "$$agora" ] && alvo=$$((alvo + 86400))
          sleep $$((alvo - agora))
          sh /usr/local/bin/backup.sh || echo "backup falhou em $$(date -Iseconds)"
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
  backups:
